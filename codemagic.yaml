# Codemagic iOS 빌드 → App Store Connect 업로드.
#
# 빌드 번호를 손으로 올리지 않는다: TestFlight·App Store에 올라간 가장 큰 번호와
# pubspec 번호 중 큰 것 + 1을 쓴다. 같은 번호를 다시 올려 거부되던 것
# (409, -19232 "bundle version must be higher", 2026-11-25)을 막는다.
# 버전 이름(1.6.x)은 지금처럼 pubspec에서 올린다 — 승인된 이름은 다시 못 쓴다(CLAUDE.md).
#
# Codemagic에 넣어 둘 환경변수 그룹(Codemagic → 앱 → Environment variables):
#   app_store_credentials
#     APP_STORE_CONNECT_ISSUER_ID       a8de3a82-…(Issuer ID)
#     APP_STORE_CONNECT_KEY_IDENTIFIER  2DKTSUX3TA
#     APP_STORE_CONNECT_PRIVATE_KEY     .p8 파일 내용 전체(Secure)
#     CERTIFICATE_PRIVATE_KEY           배포 인증서 개인키(PEM, Secure) — 아래 "서명" 참고
#   app_secrets
#     BUS_API_KEY, GEMINI_API_KEY, (있으면) BUS_ROUTE_API_KEY   → 빌드 전에 .env로 쓴다
#
# 서명: fetch-signing-files가 앱·위젯(MealWidget) 두 번들의 App Store 프로파일을 받고,
# 없으면 만든다. CERTIFICATE_PRIVATE_KEY에 기존 배포 인증서의 개인키를 넣으면 그
# 인증서를 쓰고, 새 키(ssh-keygen -t rsa -b 2048 -m PEM -f cert_key)를 넣으면 새 배포
# 인증서를 만든다(계정당 개수 제한이 있다).
#
# 이 파일을 쓰려면 Codemagic 앱 설정에서 구성 방식을 Workflow Editor → codemagic.yaml로
# 바꾼다. 자동 시작(triggering)은 두지 않았다 — 지금처럼 손으로 "Start new build".

workflows:
  ios-release:
    name: iOS 릴리스 (App Store Connect)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_store_credentials
        - app_secrets
      vars:
        APP_STORE_APP_ID: 6757637319
        BUNDLE_ID: com.knue.knuemate
        WIDGET_BUNDLE_ID: com.knue.knuemate.MealWidget
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: .env 만들기
        script: |
          # 앱이 .env를 에셋으로 읽는다(pubspec assets). 키 없이 배포되지 않게 BUS_API_KEY가
          # 비면 멈춘다. BUS_ROUTE_API_KEY는 운영 빌드에 없어도 된다(노선 스냅샷을 쓴다).
          if [ -z "$BUS_API_KEY" ]; then
            echo "BUS_API_KEY가 없습니다 — app_secrets 그룹을 확인하세요." >&2
            exit 1
          fi
          {
            echo "BUS_API_KEY=$BUS_API_KEY"
            echo "BUS_ROUTE_API_KEY=${BUS_ROUTE_API_KEY:-}"
            echo "GEMINI_API_KEY=${GEMINI_API_KEY:-}"
          } > .env

      - name: 서명 파일 받기
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: 패키지 받기
        script: |
          flutter pub get
          cd ios && pod install

      - name: 빌드 번호 정하기
        script: |
          # 실패하면(첫 업로드·API 오류) 0으로 본다 — pubspec 번호가 바닥이 된다.
          TESTFLIGHT=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          APPSTORE=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          PUBSPEC=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          LATEST=$(printf '%s\n' "${TESTFLIGHT:-0}" "${APPSTORE:-0}" "$((${PUBSPEC:-1} - 1))" | sort -n | tail -1)
          NEXT=$((LATEST + 1))
          echo "TestFlight $TESTFLIGHT · App Store $APPSTORE · pubspec $PUBSPEC → 빌드 번호 $NEXT"
          echo "BUILD_NUMBER_NEXT=$NEXT" >> "$CM_ENV"

      - name: IPA 빌드
        script: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER_NEXT" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
