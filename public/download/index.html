<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>KNUE Mate 테스트 빌드</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #16181d;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #e8eaed;
      --muted: #9aa1ab;
      --line: #262b34;
      --accent: #5b8cff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: max(24px, env(safe-area-inset-top)) 16px
            max(24px, env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 21px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .ver { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 12px;
  }
  a.dl {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    text-decoration: none;
    color: inherit;
  }
  .name { font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .btn {
    flex: none;
    background: var(--accent);
    color: #fff;
    border-radius: 9px;
    padding: 9px 15px;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }
  .note {
    border-left: 3px solid var(--accent);
    padding: 2px 0 2px 13px;
    margin-top: 26px;
    color: var(--muted);
    font-size: 13.5px;
  }
  .note strong { color: var(--text); }
  ol { padding-left: 20px; margin: 8px 0 0; }
  li { margin-bottom: 5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>KNUE Mate 테스트 빌드</h1>
  <div class="ver">1.6.1 (빌드 100) · 내부 확인용</div>

  <div class="card">
    <a class="dl" href="https://github.com/knuemeal16486/knue.mate/releases/download/v1.6.1-100/knuemate-1.6.1-100-arm64.apk">
      <span>
        <span class="name">arm64-v8a</span>
        <span class="sub">41 MB · 2017년 이후 기기 대부분</span>
      </span>
      <span class="btn">받기</span>
    </a>
  </div>

  <div class="card">
    <a class="dl" href="https://github.com/knuemeal16486/knue.mate/releases/download/v1.6.1-100/knuemate-1.6.1-100-arm32.apk">
      <span>
        <span class="name">armeabi-v7a</span>
        <span class="sub">40 MB · 위 파일이 안 깔릴 때만</span>
      </span>
      <span class="btn">받기</span>
    </a>
  </div>

  <div class="note">
    <strong>설치가 막히면</strong>
    <ol>
      <li>다운로드가 끝나면 알림을 눌러 파일 열기</li>
      <li>"이 출처의 앱 설치 허용"이 뜨면 켜기</li>
      <li>Play 스토어 버전이 깔려 있으면 서명이 달라 실패할 수 있어요 — 기존 앱을 지운 뒤 설치하세요</li>
    </ol>
  </div>

  <div class="note">
    스토어에 올라가는 정식 버전이 아닙니다. 확인이 끝나면 내려갑니다.
  </div>
</div>
</body>
</html>
