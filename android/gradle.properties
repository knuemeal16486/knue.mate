org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# google_mobile_ads를 추가하면서 :home_widget 모듈(서드파티, 우리가 못 고침)의
# Java 1.8 설정과 앱의 Kotlin jvmTarget=17이 충돌해 "Inconsistent JVM Target
# Compatibility" 오류로 빌드가 아예 멈췄다. Kotlin/AGP가 공식으로 안내하는
# 완화 방법 — 실제 컴파일 대상은 그대로 두고, 이 불일치를 오류 대신 경고로만
# 내보내게 한다.
kotlin.jvm.target.validation.mode=warning

# Play Console 권장(R8 최적화): 리소스 축소를 R8 코드 축소와 함께 돌려, 안 쓰는
# 코드가 참조하던 리소스까지 걷어낸다(AGP 8.6+, 9.0부터 기본값). 이름 문자열로만
# 찾는 리소스(알림 아이콘 등)는 res/raw/keep.xml에 남겨 뒀다.
android.r8.optimizedResourceShrinking=true
